# swiftlintの設定ファイル

# Lint対象を指定する
# included:
#   - Sources
#   - App
#   - Modules
#   - Tests

excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData
  - fastlane
  - Vendor

# ルールを有効化
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - legacy_random
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

analyzer_rules:
  - unused_import

# 無効化するルール
disabled_rules:
  - todo
  # SwiftUIでは、冗長な書き方になってしまうため、trailing closure 構文は使わないようにする
  # 複数のクロージャを引数として渡すときに、最後のクロージャだけを () の外に出すのは禁止という意味
  - multiple_closures_with_trailing_closure

# 改行時のインデントスペースを無視する
trailing_whitespace:
  ignores_empty_lines: true

# 行の長さ
line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# ファイル長
file_length:
  warning: 500
  error: 800

# 型の長さ
type_body_length:
  warning: 300
  error: 500

# 関数の長さ
function_body_length:
  warning: 40
  error: 80

# 関数の引数数
function_parameter_count:
  warning: 5
  error: 7

# Cyclomatic Complexity
cyclomatic_complexity:
  warning: 10
  error: 20

# Identifier
identifier_name:
  min_length: 2
  max_length:
    warning: 40
    error: 60
  excluded:
    - id
    - a
    - b
    - x
    - y
    - z
    - i
    - by
    - at
    - in
    - of
    - on
    - to
    - Text

# ネスト
nesting:
  type_level:
    warning: 2
  function_level:
    warning: 2

# 大きなタプル
large_tuple:
  warning: 3
  error: 4

# Reporter
reporter: "xcode"
