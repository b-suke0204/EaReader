name: EaReader CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: CheckOut
        uses: actions/checkout@v4

      # Laravel側の環境設定とテスト実行
      # PHPバージョンは、Laravelのcompose.yamlで設定されているものにする
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      # MySQLをインストール
      - name: Setup MySQL
        run: |
          brew install mysql
          brew services start mysql

      # MySQL起動確認
      - name: Wait for MySQL
        # MySQLが接続可能状態になるまで2秒ずつ確認する(60秒間) 
        run: |
          for i in {1..30}; do
            if mysqladmin ping \
              -h 127.0.0.1 \
              -u root \
              --silent; then
              echo "MySQL is ready!!"
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL failed to start within 60 seconds..."
          exit 1

      # envファイルをexampleからコピーして作成
      - name: Setup Laravel Environment
        working-directory: API  # APIフォルダ配下のLaravelプロジェクトを対象にする
        run: |
          cp .env.example .env

      # CI用のDB設定
      - name: Configure Laravel Database
        working-directory: API  # APIフォルダ配下のLaravelプロジェクトを対象にする
        run: |
          sed -i '' 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i '' 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i '' 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i '' 's/^DB_DATABASE=.*/DB_DATABASE=laravel/' .env
          sed -i '' 's/^DB_USERNAME=.*/DB_USERNAME=sail/' .env
          sed -i '' 's/^DB_PASSWORD=.*/DB_PASSWORD=password/' .env

      # MySQLのデータベース作成
      - name: Setup Test Database
        run: |
          mysql -u root <<'SQL'
          CREATE DATABASE IF NOT EXISTS laravel;

          CREATE USER IF NOT EXISTS 'sail'@'localhost'
            IDENTIFIED BY 'password';

          GRANT ALL PRIVILEGES ON laravel.*
            TO 'sail'@'localhost';

          FLUSH PRIVILEGES;
          SQL

      # Laravelの依存関係構築 composer.json
      - name: Install Composer Dependency
        working-directory: API  # APIフォルダ配下のLaravelプロジェクトを対象にする
        run: composer install --no-interaction --prefer-dist

      # APPキー生成 (.env.exampleをコピーしただけだとAPPKEYが空になるらしい)
      - name: Generate Laravel App Key
        working-directory: API  # APIフォルダ配下のLaravelプロジェクトを対象にする
        run: php artisan key:generate --force

      # migration実行
      - name: Run Migration
        working-directory: API  # APIフォルダ配下のLaravelプロジェクトを対象にする
        run: php artisan migrate --force

      # テスト実行
      - name: Laravel Test
        working-directory: API  # APIフォルダ配下のLaravelプロジェクトを対象にする
        run: php artisan test
      
      # LaravelのAPI実行開始
      - name: Start Laravel
        working-directory: API  # APIフォルダ配下のLaravelプロジェクトを対象にする
        run: |
          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > /tmp/laravel.log 2>&1 &

      # Laravel API起動確認
      # 8000のポートがサーバーになっているかで判断する
      - name: Wait for Laravel
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 8000; then
              echo "Laravel is ready!!"
              exit 0
            fi
      
            echo "Waiting for Laravel..."
            sleep 2
          done
      
          echo "Laravel failed to start within 60 seconds..."
          cat /tmp/laravel.log
          exit 1
      
      # iOS結合テスト
      - name: EaReader Integration Test
        run: |
          set -o pipefail

          xcodebuild \
            -project EaReader.xcodeproj \
            -scheme EaReader \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -only-testing:EaReaderTests \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            test

      # Laravelのログ表示
      - name: Show Laravel Log
        if: always()
        run: |
          cat /tmp/laravel.log || true
